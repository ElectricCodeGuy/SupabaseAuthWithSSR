<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- SupaChat mark: the same chat bubble + AI sparkle drawn by
       app/components/layout/Navbar/Logo.tsx. The theme tokens are
       inlined as hex here (a favicon has no access to globals.css) and the
       dark variant mirrors public/images/logo-dark.svg. -->
  <style>
    .bubble { fill: #c96442; }
    .spark  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
